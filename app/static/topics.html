<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>喵喵优选 · 主题分布</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='2' y='2' width='4' height='4' fill='%232b2632'/><rect x='10' y='2' width='4' height='4' fill='%232b2632'/><rect x='2' y='4' width='12' height='9' fill='%232b2632'/><rect x='3' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='11' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='3' y='5' width='10' height='7' fill='%23ff9f57'/><rect x='5' y='7' width='1' height='2' fill='%232b2632'/><rect x='10' y='7' width='1' height='2' fill='%232b2632'/><rect x='7' y='9' width='2' height='1' fill='%23ff8095'/></svg>" />
  <style>
    :root {
      --ink: #2b2632;
      --fur: #ff9f57;
      --coral: #ff7a59;
      --cream: #fff6e6;
      --paper: #fffaf0;
      --muted: #9b8f86;
      --error: #d6455a;
      --online: #5fcf6a;
      --shadow: 4px 4px 0 var(--ink);
      --shadow-sm: 3px 3px 0 var(--ink);
      --shadow-lg: 8px 8px 0 var(--ink);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas,
        "PingFang SC", "Microsoft YaHei", monospace;
      color: var(--ink);
      background-color: #f7d9a8;
      background-image:
        linear-gradient(rgba(43,38,50,0.05) 2px, transparent 2px),
        linear-gradient(90deg, rgba(43,38,50,0.05) 2px, transparent 2px);
      background-size: 24px 24px;
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }

    .topbar {
      background: var(--cream); border: 4px solid var(--ink); box-shadow: var(--shadow-lg);
      padding: 14px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
    .topbar .sub { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    .btn {
      font: inherit; cursor: pointer; border: 3px solid var(--ink); background: var(--paper);
      padding: 6px 14px; box-shadow: var(--shadow-sm); font-weight: 700;
    }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }


    .stats {
      margin-top: 16px; display: flex; gap: 14px; flex-wrap: wrap;
    }
    .stat {
      background: var(--paper); border: 3px solid var(--ink); box-shadow: var(--shadow-sm);
      padding: 10px 16px; font-size: 13px;
    }
    .stat b { font-size: 20px; display: block; }


    .chart {
      margin-top: 16px; background: var(--cream); border: 4px solid var(--ink);
      box-shadow: var(--shadow); padding: 16px 18px;
    }
    .chart h2 { font-size: 14px; margin: 0 0 12px; }
    .row { margin: 6px 0; }
    .row summary {
      display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none;
    }
    .row summary::-webkit-details-marker { display: none; }
    .row .name { width: 6.5em; flex-shrink: 0; font-size: 13px; font-weight: 700; text-align: right; }

    .row .name a { color: inherit; text-decoration: none; border-bottom: 2px solid var(--fur); }
    .row .name a:hover { background: var(--fur); }
    .row.zero .name a { border-bottom-color: var(--muted); }
    .samples .all {
      display: inline-block; margin-top: 7px; font-size: 12px; text-decoration: none;
      color: var(--ink); border: 3px solid var(--ink); background: var(--cream);
      padding: 2px 9px; box-shadow: 2px 2px 0 var(--ink); font-weight: 700;
    }
    .row .track { flex: 1; background: var(--paper); border: 2px solid var(--ink); height: 22px; position: relative; }
    .row .bar {
      display: block; height: 100%; background: var(--fur); border-right: 2px solid var(--ink);
      min-width: 2px; transition: width .4s;
    }
    .row.zero .bar { display: none; }
    .row.catalog .bar { display: none; }
    .row.zero { opacity: .45; }
    .row .count {
      width: 3em; flex-shrink: 0; font-weight: 700; font-size: 13px;
    }
    .row.top1 .bar { background: var(--coral); }
    .samples {
      margin: 6px 0 10px calc(6.5em + 10px); font-size: 12.5px; color: var(--ink);
      background: var(--paper); border: 2px dashed var(--ink); padding: 8px 12px;
    }
    .samples div { margin: 2px 0; }
    .samples .none { color: var(--muted); }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .err {
      margin-top: 16px; background: var(--paper); border: 3px solid var(--error);
      color: var(--error); padding: 10px 14px; font-size: 13px; display: none;
    }
  </style>
  <link rel="stylesheet" href="/static/warm-theme.css?v=1" />
  <link rel="stylesheet" href="/static/admin-theme.css?v=2" />
</head>
<body class="admin-home">
  <div class="wrap">
    <div class="topbar">
      <h1>主题分布</h1>
      <span class="sub" id="topicSub">低置信度问题 → 分类器旁路归类 → 哪类堆得多,先补哪块知识</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="stats">
      <div class="stat">已归类问题<b id="total">-</b></div>
      <div class="stat">最近归类<b id="latest" style="font-size:14px;line-height:28px">-</b></div>
      <div class="stat">命中类目数<b id="hitClasses">-</b></div>
    </div>

    <div class="chart">
      <h2>17 类权威类目 · 问题量(降序,点行展开样例,点类目名看全部)</h2>
      <div id="rows"></div>
      <div class="hint" id="sourceHint">多标签问题计入每个命中类目。</div>
    </div>

    <div class="err" id="err"></div>
  </div>

  <script src="/static/admin-auth.js"></script>
  <script src="/static/admin.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    async function loadCatalog() {
      try {
        const r = await fetch('/api/topics/catalog', {cache: 'no-store'});
        if (r.ok) render(await r.json());
      } catch (_) {

      }
    }

    async function load() {
      try {
        const r = await fetch('/api/topics/distribution', {cache: 'no-store'});
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.detail || ('HTTP ' + r.status));
        }
        render(await r.json());
        $('err').style.display = 'none';
      } catch (e) {
        $('err').textContent = '拉取分布失败:' + e.message;
        $('err').style.display = 'block';
      }
    }

    function render(data) {
      const catalog = data.status === 'catalog';
      if (!catalog) {
        const historical = data.source === 'conversation_history';
        $('topicSub').textContent = historical
          ? '历史用户提问 → 已训练分类器 → 隔离库归类（不改业务表）'
          : '低置信度问题 → 分类器旁路归类 → 哪类堆得多,先补哪块知识';
        $('sourceHint').textContent = historical
          ? '数据来自历史会话隔离归类库；多标签问题计入每个命中类目。'
          : '数据来自 topic_classifications；多标签问题计入每个命中类目。';
      }
      $('total').textContent = catalog ? '—' : data.total;

      $('latest').textContent = !catalog && data.latest
        ? new Date(data.latest + 'Z').toLocaleString('zh-CN', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false,
          })
        : '—';
      const classes = catalog ? data.classes : [...data.classes].sort((a, b) => b.count - a.count);
      $('hitClasses').textContent = catalog ? '—' : classes.filter(c => c.count > 0).length + ' / 17';
      const max = catalog ? 1 : Math.max(1, ...classes.map(c => c.count));
      const rows = $('rows');
      rows.innerHTML = '';
      classes.forEach((c, i) => {
        const d = document.createElement('details');
        d.className = 'row' + (catalog ? ' catalog' : c.count === 0 ? ' zero' : '')
          + (!catalog && i === 0 && c.count > 0 ? ' top1' : '');
        const pct = catalog ? 0 : Math.round(c.count / max * 100);
        const href = '/topics/questions?label=' + encodeURIComponent(c.label) + '&page=1';
        const summary = document.createElement('summary');
        const name = document.createElement('span');
        name.className = 'name';
        if (c.count) {
          const a = document.createElement('a');
          a.href = href;
          a.textContent = c.label;
          name.appendChild(a);
        } else name.textContent = c.label;
        const track = document.createElement('span');
        track.className = 'track';
        const bar = document.createElement('span');
        bar.className = 'bar';
        bar.style.width = pct + '%';
        track.appendChild(bar);
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = catalog ? '—' : c.count;
        summary.append(name, track, count);
        const samples = document.createElement('div');
        samples.className = 'samples';
        if (catalog) {
          const line = document.createElement('div');
          line.textContent = c.boundary;
          samples.appendChild(line);
        } else if (c.samples.length) {
          c.samples.forEach(s => {
            const line = document.createElement('div');
            line.textContent = '· ' + s;
            samples.appendChild(line);
          });
          const all = document.createElement('a');
          all.className = 'all';
          all.href = href;
          all.textContent = `查看全部 ${c.count} 条 →`;
          samples.appendChild(all);
        } else {
          const empty = document.createElement('div');
          empty.className = 'none';
          empty.textContent = '暂无样例';
          samples.appendChild(empty);
        }
        d.append(summary, samples);
        rows.appendChild(d);
      });
    }

    $('refreshBtn').onclick = load;
    mountAdminNav('/topics');
    loadCatalog().then(load);
  </script>
</body>
</html>
