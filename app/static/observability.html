<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>喵喵优选 · 观测与成本</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='2' y='2' width='4' height='4' fill='%232b2632'/><rect x='10' y='2' width='4' height='4' fill='%232b2632'/><rect x='2' y='4' width='12' height='9' fill='%232b2632'/><rect x='3' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='11' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='3' y='5' width='10' height='7' fill='%23ff9f57'/><rect x='5' y='7' width='1' height='2' fill='%232b2632'/><rect x='10' y='7' width='1' height='2' fill='%232b2632'/><rect x='7' y='9' width='2' height='1' fill='%23ff8095'/></svg>" />
  <link rel="stylesheet" href="/static/acceptance.css" />
  <style>
    .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); margin-top: 4px; }
    @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
      background: var(--paper); border: 3px solid var(--ink); box-shadow: var(--shadow-sm);
      padding: 10px 13px 12px;
    }
    .kpi .k-label { font-size: 11.5px; color: var(--muted); }
    .kpi .k-val { font-size: 25px; font-weight: 700; line-height: 1.4; font-variant-numeric: tabular-nums; }
    .kpi .k-val small { font-size: 13px; margin-left: 2px; }
    .kpi .k-sub { font-size: 11.5px; color: #6d6478; line-height: 1.7; }


    .shares { margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
    .sh-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
    .sh-label .nm b { font-weight: 700; }
    .sh-label .nm span { color: var(--muted); font-size: 11px; margin-left: 7px; }
    .sh-label .pv { font-variant-numeric: tabular-nums; font-weight: 700; }
    .bar-track { height: 15px; border: 2px solid var(--ink); background: var(--cream); margin-top: 4px; }
    .bar-fill { height: 100%; display: block; background: var(--sky); }
    .bar-fill.top { background: var(--coral); }


    .read {
      margin-top: 13px; border: 3px dashed var(--ink); background: var(--paper);
      padding: 9px 13px; font-size: 12.5px; line-height: 1.8;
    }
    .read b { background: var(--fur); padding: 0 4px; border: 2px solid var(--ink); }
    .read::before {
      content: "读图"; float: left; font-size: 11px; background: var(--ink); color: var(--cream);
      padding: 1px 7px; margin: 2px 9px 2px 0;
    }

    .subhead { font-size: 13px; font-weight: 700; margin: 16px 0 2px; }
    .subhead .unit { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 7px; }

    table.tbl td.up { color: #2f8f3c; }
    table.tbl td.down { background: #ffe9ec; color: var(--error); font-weight: 700; }
    table.tbl td.flat { color: var(--muted); }
    table.tbl td .arrow { margin-left: 5px; }

    .chart-scroll { overflow-x: auto; }
    svg.chart { display: block; width: 100%; height: auto; min-width: 560px; font-family: inherit; }
    svg .axis { fill: var(--muted); font-size: 11px; }
    svg .glabel { fill: var(--ink); font-size: 12px; font-weight: 700; }
    svg .grid line { stroke: rgba(43,38,50,0.16); stroke-width: 1; }
    svg .base { stroke: var(--ink); stroke-width: 2.5; }
    svg .ln { fill: none; stroke-width: 2.5; }
    svg .pick { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; }
    svg .inuse { stroke: var(--violet); stroke-width: 2; }

    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 2px; }
    .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .lg i { width: 12px; height: 12px; border: 2px solid var(--ink); flex: none; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
    .note { border: 3px solid var(--ink); background: var(--paper); padding: 10px 13px; }
    .note h3 { margin: 0 0 5px; font-size: 12.5px; }
    .note p { margin: 0; font-size: 12px; color: #6d6478; line-height: 1.8; }
    .note code { background: var(--cream); border: 2px solid var(--ink); padding: 0 4px; font-size: 11.5px; }
  </style>
  <link rel="stylesheet" href="/static/warm-theme.css?v=1" />
  <link rel="stylesheet" href="/static/admin-theme.css?v=2" />
</head>
<body class="admin-home">
  <div class="wrap">
    <div class="topbar">
      <h1>观测与成本</h1>
      <span class="sub">模型用量与成本 · 指标有没有劣化 · 兜底阈值怎么定的</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div id="body"><div class="miss">加载中…</div></div>
  </div>

  <div id="toast"></div>
  <script src="/static/admin.js"></script>
  <script src="/static/acceptance.js"></script>
  <script>

    const NS = "http://www.w3.org/2000/svg";
    const METRIC_LABEL = {
      recall_at_5: "Recall@5", recall_at_10: "Recall@10", mrr: "MRR",
      recall_at_k: "Recall@K", faithfulness: "Faithfulness",
      refusal_accuracy: "拒答正确率", refusal_rate: "拒答率",
    };
    const DELTA_EPS = 0.005;
    const fmt3 = (v) => (v === null || v === undefined ? "—" : Number(v).toFixed(3));
    const pct = (v) => (v === null || v === undefined ? "—" : Math.round(v * 100) + "%");
    const thousands = (n) => (n === null || n === undefined ? "—" : Number(n).toLocaleString("en-US"));

    function svgEl(tag, attrs, txt) {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (txt !== undefined && txt !== null) e.textContent = txt;
      return e;
    }

    function kpis(items) {
      const box = el("div", "kpis");
      for (const k of items) {
        const c = el("div", "kpi");
        c.appendChild(el("div", "k-label", k.label));
        const v = el("div", "k-val", k.val);
        if (k.unit) v.appendChild(el("small", null, k.unit));
        c.appendChild(v);
        c.appendChild(el("div", "k-sub", k.sub));
        box.appendChild(c);
      }
      return box;
    }

    function table(headers, rows) {
      const t = el("table", "tbl");
      const thead = el("thead"), tr = el("tr");
      for (const h of headers) tr.appendChild(el("th", null, h));
      thead.appendChild(tr);
      t.appendChild(thead);
      const tb = el("tbody");
      for (const r of rows) tb.appendChild(r);
      t.appendChild(tb);
      const scroll = el("div", "scroll-x");
      scroll.appendChild(t);
      return scroll;
    }

    function panelHead(p, title, pill, lede) {
      const h = el("h2", null, title);
      if (pill) h.appendChild(el("span", "pill " + pill[1], pill[0]));
      p.appendChild(h);
      p.appendChild(el("p", "lede", lede));
    }


    function jobFoot(p, block) {
      if (!block.can_run || !block.job) {
        return;
      }

      p.appendChild(el("div", "subhead", "在页面上重跑"));
      p.appendChild(jobRow([block.job], load, block.make));
    }


    function costPanel(d) {
      const p = el("div", "panel");
      panelHead(p, "意图用量与成本", ["数据源 MySQL", "info"],
        "按已保存的模型生成记录汇总真实 token 用量。只有配置了模型价格版本的调用才计算费用估算。");
      if (!d.present || !d.rows.length) {
        p.appendChild(missingBox(d.hint));
        jobFoot(p, d);
        return p;
      }
      const s = d.summary;
      const totalTokens = s.known_input_tokens + s.known_output_tokens;
      p.appendChild(kpis([
        { label: "请求数", val: thousands(s.requests), sub: "按 trace 去重" },
        { label: "模型生成", val: thousands(s.generations), sub: "同一请求可能多次调用" },
        { label: "已知 token", val: thousands(totalTokens), sub: "输入 " + thousands(s.known_input_tokens) + " · 输出 " + thousands(s.known_output_tokens) },
        { label: "未定价调用", val: thousands(s.unpriced), sub: "用量未知 " + thousands(s.unknown_usage) + " 次" },
      ]));

      p.appendChild(el("div", "subhead", "按意图的已知 token 分布"));
      const shares = el("div", "shares");
      for (const r of d.rows) {
        const tokens = r.input_tokens + r.output_tokens;
        const share = totalTokens > 0 ? tokens / totalTokens : 0;
        const w = el("div");
        const lab = el("div", "sh-label");
        const nm = el("div", "nm");
        nm.appendChild(el("b", null, r.intent));
        nm.appendChild(el("span", null, r.requests + " 次请求 · " + r.generations + " 次生成"));
        lab.appendChild(nm);
        lab.appendChild(el("div", "pv", (totalTokens > 0 ? pct(share) : "—") + " · " + thousands(tokens) + " token"));
        w.appendChild(lab);
        const track = el("div", "bar-track");
        const fill = el("span", "bar-fill" + (r === d.rows[0] ? " top" : ""));
        fill.style.width = (share * 100) + "%";
        track.appendChild(fill);
        w.appendChild(track);
        shares.appendChild(w);
      }
      p.appendChild(shares);

      const rows = d.rows.map((r) => {
        const tr = el("tr");
        const subtotal = Object.entries(r.priced_subtotals)
          .map(([currency, amount]) => currency + " " + amount)
          .join(" / ");
        tr.appendChild(el("td", null, r.intent));
        tr.appendChild(el("td", "num", thousands(r.requests)));
        tr.appendChild(el("td", "num", thousands(r.generations)));
        tr.appendChild(el("td", "num", thousands(r.input_tokens)));
        tr.appendChild(el("td", "num", thousands(r.output_tokens)));
        tr.appendChild(el("td", "num", thousands(r.unknown_usage)));
        tr.appendChild(el("td", "num", subtotal ? subtotal + (r.unpriced ? "（部分未定价）" : "") : "未定价"));
        tr.appendChild(el("td", "num", r.p95_generation_ms === null ? "—" : Math.round(r.p95_generation_ms) + " ms"));
        return tr;
      });
      p.appendChild(el("div", "subhead", "明细"));
      p.appendChild(table(["意图", "请求数", "生成数", "输入 token", "输出 token", "未知用量", "费用估算", "生成 P95"], rows));

      const priceVersions = [...new Set(d.rows.flatMap((r) => r.price_versions))]
        .map((version) => version === "deepseek-v4.1-flash@2026-09-10:peak-cache-miss-reference"
          ? "DeepSeek V4.1 Flash（2026-09-10，高峰/缓存未命中参考价）"
          : version);
      const read = el("div", "read");
      read.textContent = "来源：" + d.meta.source
        + "。范围：已保存的模型生成记录。生成时间："
        + new Date(d.meta.generated_at).toLocaleString("zh-CN")
        + "。" + (s.unpriced
          ? s.unpriced + " 次调用没有可用的价格版本，费用总账不完整。"
          : "费用按币种分别列示，不跨币种相加。")
        + (priceVersions.length ? "价格版本：" + priceVersions.join("；") + "。" : "")
        + "金额仅按已知输入/输出 token 参考估算，未还原实际缓存命中与计费时段，不是账单。"
        + "当前 P95 仅表示模型生成耗时，不是整轮响应耗时。";
      p.appendChild(read);
      jobFoot(p, d);
      return p;
    }


    function trendPanel(d) {
      const p = el("div", "panel");
      panelHead(p, "评估趋势", ["数据源 eval_runs 表", "info"],
        "只比较相同题目、配置、策略和 K 的运行；失败留在分母，未运行裁判显示为空。");
      if (d.status === "error") {
        p.appendChild(missingBox("趋势读不到:" + (d.note || "")));
        jobFoot(p, d);
        return p;
      }
      if (!d.present) {
        p.appendChild(missingBox(d.hint));
        jobFoot(p, d);
        return p;
      }
      const runs = d.runs, latest = runs[0], prev = runs[1];
      const drops = prev
        ? d.metric_names.filter((n) => latest.metrics[n] != null && prev.metrics[n] != null
            && latest.metrics[n] < prev.metrics[n] - DELTA_EPS)
        : [];
      p.appendChild(kpis([
        { label: "可比较轮次", val: String(runs.length), sub: "最多展示最近十轮" },
        { label: "最近一轮", val: fmt3(latest.metrics.faithfulness), sub: "忠实度需独立裁判；未裁判为空" },
        { label: "检索 MRR", val: fmt3(latest.metrics.mrr), sub: "Recall@" + latest.top_k + " " + fmt3(latest.metrics.recall_at_k) },
        { label: "失败数", val: String(latest.metrics.failures), sub: "本轮 " + latest.metrics.cases + " 题；" + latest.status },
      ]));

      const rows = runs.map((r, i) => {
        const older = runs[i + 1];
        const tr = el("tr");
        tr.appendChild(el("td", null, "#" + r.id));
        tr.appendChild(el("td", null, fmtTime(r.created_at).slice(5, 16)));
        tr.appendChild(el("td", null, r.triggered_by));
        tr.appendChild(el("td", "num", String(r.metrics.cases)));
        for (const n of d.metric_names) {
          const v = r.metrics[n], o = older ? older.metrics[n] : undefined;
          let cls = "num", arrow = "";
          if (v !== undefined && v !== null && o !== undefined && o !== null) {
            const delta = v - o;
            cls += delta > DELTA_EPS ? " up" : (delta < -DELTA_EPS ? " down" : " flat");
            arrow = delta > DELTA_EPS ? "↑" : (delta < -DELTA_EPS ? "⚠↓" : "→");
          }
          const td = el("td", cls, fmt3(v));
          if (arrow) td.appendChild(el("span", "arrow", arrow));
          tr.appendChild(td);
        }
        return tr;
      });
      p.appendChild(el("div", "subhead", "最近十轮(新在上)"));
      p.appendChild(table(["轮次", "时间", "触发", "评估集"]
        .concat(d.metric_names.map((n) => METRIC_LABEL[n])), rows));

      const read = el("div", "read");
      read.textContent = drops.length
        ? "可比较的上一轮中，" + drops.map((n) => METRIC_LABEL[n]).join("、") + " 下滑；需要检查本轮明细。"
        : (prev ? "可比较指标未见明显下滑。" : "目前只有一轮可比较的评测。")
          + (d.omitted_incomparable ? "另有 " + d.omitted_incomparable + " 轮配置不同，未参与比较。" : "");
      p.appendChild(read);
      jobFoot(p, d);
      return p;
    }


    function scanChart(svg, scan, pick, inUse) {
      const W = 720, H = 300, M = { l: 42, r: 14, t: 16, b: 46 };
      const plotW = W - M.l - M.r, plotH = H - M.t - M.b, y0 = M.t + plotH;
      const xs = (t) => M.l + ((t - 0.05) / 0.9) * plotW;
      const ys = (v) => y0 - v * plotH;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const grid = svgEl("g", { class: "grid" });
      for (const t of [0, 0.25, 0.5, 0.75, 1]) {
        grid.appendChild(svgEl("line", { x1: M.l, y1: ys(t), x2: M.l + plotW, y2: ys(t) }));
        svg.appendChild(svgEl("text", { x: M.l - 8, y: ys(t) + 3.5, "text-anchor": "end", class: "axis" }, t.toFixed(2)));
      }
      svg.insertBefore(grid, svg.firstChild);
      svg.appendChild(svgEl("line", { x1: M.l, y1: y0, x2: M.l + plotW, y2: y0, class: "base" }));
      for (const t of [0.05, 0.2, 0.4, 0.6, 0.8, 0.95]) {
        svg.appendChild(svgEl("text", { x: xs(t), y: y0 + 20, "text-anchor": "middle", class: "axis" }, t.toFixed(2)));
      }
      svg.appendChild(svgEl("text", { x: M.l + plotW / 2, y: y0 + 38, "text-anchor": "middle", class: "glabel" }, "阈值 t"));
      const line = (key, color) => {
        const pts = scan.map((r) => xs(r.threshold).toFixed(1) + "," + ys(r[key]).toFixed(1)).join(" ");
        svg.appendChild(svgEl("polyline", { points: pts, class: "ln", stroke: color }));
      };
      line("pass_rate", "var(--online)");
      line("leak_rate", "var(--error)");
      if (inUse !== null && inUse !== undefined && inUse !== pick) {
        svg.appendChild(svgEl("line", { x1: xs(inUse), y1: M.t, x2: xs(inUse), y2: y0, class: "inuse" }));
      }
      if (pick !== null && pick !== undefined) {
        svg.appendChild(svgEl("line", { x1: xs(pick), y1: M.t, x2: xs(pick), y2: y0, class: "pick" }));
        svg.appendChild(svgEl("text", { x: xs(pick) + 6, y: M.t + 12, class: "glabel" }, "选定 " + pick.toFixed(2)));
      }
    }

    function calibrationPanel(d) {
      const p = el("div", "panel");
      panelHead(p, "置信度阈值校准", ["独立校准集", "info"],
        "用独立 calibration 集的真实检索分数扫描阈值；推荐值不会自动改动在线配置。");
      const w = d.weights;
      const wnote = el("div", "note");
      wnote.appendChild(el("h3", null, "置信度怎么算出来的"));
      wnote.appendChild(el("p", null,
        "四信号加权:Top1 精排分 " + w.top1 + " / 有效证据数 " + w.valid_count
        + " / Top1-Top2 分差 " + w.margin + " / 关键条款命中 " + w.key_clause
        + "。权重是代码里的常量,校准校的是这条线该划在哪。"));
      if (!d.present) {
        p.appendChild(missingBox(d.hint));
        p.appendChild(wnote);
        jobFoot(p, d);
        return p;
      }
      const rec = d.recommended, dist = d.distribution;
      p.appendChild(kpis([
        { label: "推荐阈值", val: rec.threshold.toFixed(2), sub: "Youden J " + fmt3(rec.youden_j) + " · 两拨分得最开的那条线" },
        { label: "在用阈值", val: Number(d.in_use).toFixed(2),
          sub: d.in_sync ? "与推荐一致" : "与推荐不一致,该回填 app/config.py" },
        { label: "可答通过率", val: pct(rec.pass_rate), sub: "库里有答案且这次召回够硬的占比" },
        { label: "应拒放行率", val: pct(rec.leak_rate), sub: "库外问题被放进来答的占比" },
      ]));

      const drows = [["可答(A/B/C 桶)", dist.answerable],
                     ["应拒(D 桶)", dist.absent]].map(([name, s]) => {
        const tr = el("tr");
        tr.appendChild(el("td", null, name));
        for (const k of ["n", "min", "p25", "p50", "p75", "max"]) {
          tr.appendChild(el("td", "num", k === "n" ? String(s.n) : fmt3(s[k])));
        }
        return tr;
      });
      p.appendChild(el("div", "subhead", "证据置信度分布"));
      p.appendChild(table(["题型", "题数", "最低", "p25", "中位", "p75", "最高"], drows));

      const sub = el("div", "subhead", "阈值扫描");
      sub.appendChild(el("span", "unit", "0.05 → 0.95,步进 0.01"));
      p.appendChild(sub);
      const lg = el("div", "legend");
      for (const [label, color] of [["可答通过率", "var(--online)"], ["应拒放行率", "var(--error)"],
                                    ["选定阈值", "var(--ink)"], ["在用阈值", "var(--violet)"]]) {
        const s = el("span", "lg");
        const i = el("i");
        i.style.background = color;
        s.appendChild(i);
        s.appendChild(document.createTextNode(label));
        lg.appendChild(s);
      }
      p.appendChild(lg);
      const scroll = el("div", "chart-scroll");
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "chart");
      svg.setAttribute("viewBox", "0 0 720 300");
      scroll.appendChild(svg);
      p.appendChild(scroll);
      scanChart(svg, d.scan, rec.threshold, d.in_use);

      const read = el("div", "read");
      read.textContent = "当前校准集推荐阈值 " + rec.threshold.toFixed(2)
        + "：可答通过率 " + pct(rec.pass_rate) + "，应拒放行率 " + pct(rec.leak_rate)
        + "。样本集以外的效果仍需 holdout 复评。";
      p.appendChild(read);

      const split = el("div", "split");
      split.style.marginTop = "14px";
      split.appendChild(wnote);
      const n2 = el("div", "note");
      n2.appendChild(el("h3", null, "什么是「可答被误拦」"));
      n2.appendChild(el("p", null,
        "库里其实有答案,但那一次召回的证据太散(库里写「猫窝清洗保养说明」,用户问"
        + "「能扔洗衣机里洗吗」),精排分上不去,置信度算出来低于线。闸只看证据分,"
        + "不知道「库里有」,于是当成答不上处理。这条问题落池、归并、审核补进知识库,"
        + "下次同样问法就召回得动了。"));
      split.appendChild(n2);
      p.appendChild(split);
      jobFoot(p, d);
      return p;
    }

    async function load() {
      const body = $("body");
      try {
        const d = await api("/api/observability/overview");
        body.innerHTML = "";
        const panels = [
          ["cost", "意图成本账", costPanel],
          ["trend", "评估趋势", trendPanel],
          ["calibration", "置信度阈值校准", calibrationPanel],
        ];

        for (const [key, title, render] of panels) {
          const block = d[key];

          if (!block.present) {
            const panel = el("div", "panel");
            const label = block.status === "error"
              ? "读取失败"
              : block.status === "not_integrated"
                ? "尚未接入"
                : "暂无数据";

            panelHead(panel, title, [label, "info"], block.hint || label);
            body.appendChild(panel);
            continue;
          }

          body.appendChild(render(block));
        }
      } catch (e) {
        body.innerHTML = "";
        body.appendChild(missingBox("取数失败：" + e.message));
        toast("取数失败：" + e.message, true);
      }
    }

    $("refreshBtn").onclick = load;
    mountAdminNav("/observability");
    load();
  </script>
</body>
</html>
