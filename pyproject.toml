[project]
name = "assistflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.1",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.3.5",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncmy>=0.2.9",
    "alembic>=1.16.0",
    "langchain-text-splitters>=1.1.2",
    "pymilvus>=2.6.0,<3.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph>=1.0,<2.0",
    "jsonschema==4.26.0",
    "referencing>=0.37.0",
    "mcp>=2,<3",
    "httpx2",
    "langfuse>=4,<5",
    "psutil>=7.2.2",
]
[dependency-groups]
dev = [
    "playwright>=1.55.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
]
ml = [
    "torch>=2.6",
    "transformers>=4.46,<5",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
